name: Publish nimstatus to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-nimstatus
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Jaykay73/free-models' && ((github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select a release commit from main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          git checkout --detach "$revision"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("clients/python/pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project["name"] != "nimstatus" or f'v{project["version"]}' != os.environ["RELEASE_TAG"]:
              raise SystemExit("The release tag must match the nimstatus package version.")
          PY
      - name: Build and check the client wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip wheel --no-index --no-deps --no-build-isolation ./clients/python --wheel-dir dist/pypi
          python -m pip install --no-index --no-deps dist/pypi/nimstatus-*.whl
          python -I -c "from nimstatus import ModelRouter; ModelRouter()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nimstatus-wheel
          path: dist/pypi/nimstatus-*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nimstatus-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
