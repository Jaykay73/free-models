name: Probe NVIDIA models
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: data
          path: data
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install verified wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify offline suite
        run: python -m pytest -q
      - name: Record data revision
        run: git -C data rev-parse HEAD > base-revision.txt
      - name: Probe (only step receiving the NVIDIA secret)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NIMSTATUS_ALLOWED_ORIGIN: https://integrate.api.nvidia.com
          PYTHONPATH: src
        run: python -m nimstatus.main --data-dir data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: probe-state
          path: |
            data/history.json
            data/status.json
            base-revision.txt
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: data
          path: data
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: probe-state
          path: incoming
      - name: Validate bounded JSON and expected data revision
        run: python3 -I source/scripts/validate_publication.py incoming data
      - name: Commit validated state
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- history.json status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update probe state'
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then exit 0; fi
            git pull --rebase origin data || exit 1
          done
          exit 1
