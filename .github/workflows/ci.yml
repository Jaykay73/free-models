name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m pytest -q
      - name: Build and smoke-test the standalone client
        run: |
          python -m pip wheel --no-index --no-deps --no-build-isolation ./clients/python --wheel-dir dist/client
          python -m pip install --no-index --no-deps dist/client/*.whl
          python -I -c "from nimstatus import ModelRouter; from importlib.metadata import requires; assert not requires('nimstatus'); ModelRouter()"
      - name: Offline CLI
        env:
          PYTHONPATH: src
        run: python -m nimstatus.main --offline tests/fixtures/healthy --config tests/fixtures/healthy/models.yml --dry-run
